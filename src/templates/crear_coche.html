{% extends "fragments/base.html" %}

{% block title %}Crear coche{% endblock %}

{% block content %}
<h1>Añadir nuevo Audi</h1>

{% if mensaje %}
    <div class="alerta creada">{{ mensaje }}</div>
{% endif %}

<form action="/coches/crear" method="post" class="formulario">
    <label for="modelo">Modelo:</label>
    <input id="modelo" type="text" name="modelo" required>

    <label for="anio">Año:</label>
    <input id="anio" type="number" name="anio" required>

    <label for="precio">Precio (€):</label>
    <input id="precio" type="number" name="precio" required>

    <button class="btn" type="submit">Crear coche</button>
</form>

<p class="acciones-extra">
    <a class="btn btn-secondary" href="/coches">Volver al listado</a>
</p>
{% endblock %}
